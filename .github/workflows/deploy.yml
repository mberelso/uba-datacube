name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Jeden Montag um 04:00 Uhr UTC automatisch frische DWD-Hitzedaten ziehen & deployen
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Update DWD Heat Data
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/dwd/build_heat_thresholds.py
          else
            python scripts/dwd/build_heat_thresholds.py --skip-if-exists
          fi

      - name: Commit fresh heat data
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/heat_thresholds.json
          git diff --cached --quiet || git commit -m "data: weekly DWD heat threshold refresh"
          git push

      - name: Cache Chrome deb
        uses: actions/cache@v4
        with:
          path: google-chrome-stable_current_amd64.deb
          key: chrome-stable-v1

      - name: Install Chrome for prerender
        run: |
          [ -f google-chrome-stable_current_amd64.deb ] || wget -q --tries=3 https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update -qq
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          echo "CHROMIUM_PATH=$(which google-chrome-stable)" >> $GITHUB_ENV

      - run: npm ci
      - run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
