name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Jeden Montag um 04:00 Uhr UTC automatisch frische DWD-Hitzedaten ziehen & deployen
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Update DWD Heat Data
        run: python scripts/dwd/build_heat_thresholds.py

      - name: Install Chrome for prerender
        run: |
          # Das apt-Paket "chromium-browser" ist auf ubuntu-latest nur ein
          # Snap-Übergangsstub und schlägt in CI fehl. Stattdessen Google
          # Chrome Stable aus dem offiziellen .deb installieren.
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update -qq
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          rm google-chrome-stable_current_amd64.deb
          echo "CHROMIUM_PATH=$(which google-chrome-stable)" >> $GITHUB_ENV

      - run: npm ci
      - run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
