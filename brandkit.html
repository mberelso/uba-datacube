<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UBA-Datacube — Brand Identity System</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a1a; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: system-ui; padding: 24px; }
  canvas { display: block; border-radius: 4px; box-shadow: 0 8px 48px rgba(0,0,0,0.5); max-width: 100%; }
  .hint { color: #555; font-size: 12px; margin-top: 12px; letter-spacing: 0.05em; }
  #loading { color: #444; font-size: 13px; margin-top: 16px; letter-spacing: 0.05em; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<p class="hint">UBA-Datacube — Brand Identity System 2026</p>
<p id="loading">Bilder werden geladen…</p>

<script>
const canvas = document.getElementById('c');
const W = 1440, H = 960;
canvas.width = W;
canvas.height = H;
const ctx = canvas.getContext('2d');

const P = {
  canvas:   '#CBC8BF',
  panel:    '#F2EFE9',
  panelAlt: '#E6E2DA',
  navy:     '#1B2B3A',
  slate:    '#3D5A6E',
  mist:     '#7A9BAD',
  moss:     '#4A6741',
  fog:      '#A8B8C0',
  stone:    '#8C8880',
  ink:      '#1B2B3A',
  white:    '#F4F2EE',
  cream:    '#FAF8F4',
};

const G = 14;
const pw = (W - G * 4) / 3;
const ph = (H - G * 4) / 3;
function px(col) { return G + col * (pw + G); }
function py(row) { return G + row * (ph + G); }

// ── image sources — picsum seeds chosen for Nordic nature feel ──────────────
// Each seed deterministically returns the same photo
const IMGS = {
  // Panel (0,0) logo cover: misty fjord water — seed 1043
  logoCover:   `https://picsum.photos/seed/1043/${Math.ceil(pw)}/${Math.ceil(ph)}`,
  // Panel (0,2) Bildwelt: nordic forest/lake — seed 399
  bildwelt:    `https://picsum.photos/seed/399/${Math.ceil(pw)}/${Math.ceil(ph)}`,
  // Panel (2,2) Anwendung: aerial water — seed 1074
  anwendung:   `https://picsum.photos/seed/1074/${Math.ceil(pw)}/${Math.ceil(ph)}`,
};

function loadImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('Failed: ' + url));
    img.src = url;
  });
}

// ── drawing helpers ────────────────────────────────────────────────────────
function rect(x, y, w, h, fill, radius = 6) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, radius);
  ctx.fillStyle = fill;
  ctx.fill();
}

function line(x1, y1, x2, y2, stroke, width = 1) {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.strokeStyle = stroke;
  ctx.lineWidth = width;
  ctx.stroke();
}

function sectionTag(text, x, y, col) {
  ctx.save();
  ctx.font = '600 7.5px system-ui';
  ctx.fillStyle = col || P.mist;
  ctx.letterSpacing = '1.5px';
  ctx.fillText(text.toUpperCase(), x, y);
  ctx.restore();
}

function chip(text, x, y, fill, textCol = '#fff', radius = 4) {
  ctx.save();
  ctx.font = '500 9px system-ui';
  const tw = ctx.measureText(text).width;
  rect(x, y - 10, tw + 14, 16, fill, radius);
  ctx.fillStyle = textCol;
  ctx.textAlign = 'left';
  ctx.fillText(text, x + 7, y + 1);
  ctx.restore();
}

// Draw image clipped to a rounded panel, then overlay color + opacity
function drawPhotoPanel(img, x, y, w, h, overlayCol, overlayAlpha, radius = 6) {
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, radius);
  ctx.clip();
  // cover-fit
  const ir = img.width / img.height;
  const pr = w / h;
  let sx = 0, sy = 0, sw = img.width, sh = img.height;
  if (ir > pr) { sw = img.height * pr; sx = (img.width - sw) / 2; }
  else { sh = img.width / pr; sy = (img.height - sh) / 2; }
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
  // overlay
  ctx.fillStyle = overlayCol;
  ctx.globalAlpha = overlayAlpha;
  ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawCubeMark(cx, cy, size, strokeCol, accentCol, lineW = 1.5) {
  const s = size, h = s * 0.577;
  ctx.beginPath();
  ctx.moveTo(cx, cy); ctx.lineTo(cx+s, cy-h); ctx.lineTo(cx+2*s, cy); ctx.lineTo(cx+s, cy+h);
  ctx.closePath();
  ctx.fillStyle = strokeCol + '18'; ctx.fill();
  ctx.strokeStyle = strokeCol; ctx.lineWidth = lineW; ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(cx, cy); ctx.lineTo(cx, cy+s); ctx.lineTo(cx+s, cy+h+s); ctx.lineTo(cx+s, cy+h);
  ctx.closePath();
  ctx.fillStyle = strokeCol + '28'; ctx.fill();
  ctx.strokeStyle = strokeCol; ctx.lineWidth = lineW; ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(cx+2*s, cy); ctx.lineTo(cx+2*s, cy+s); ctx.lineTo(cx+s, cy+h+s); ctx.lineTo(cx+s, cy+h);
  ctx.closePath();
  ctx.fillStyle = strokeCol + '0C'; ctx.fill();
  ctx.strokeStyle = strokeCol; ctx.lineWidth = lineW; ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx+s, cy + h*0.4 + s*0.05, size*0.14, 0, Math.PI*2);
  ctx.fillStyle = accentCol; ctx.fill();
}

// ── MAIN DRAW (called after images load) ──────────────────────────────────
function draw(imgs) {
  // Background
  ctx.fillStyle = P.canvas;
  ctx.fillRect(0, 0, W, H);

  // Plain panels first (photos will overdraw their own panels)
  for (let r = 0; r < 3; r++) {
    for (let c = 0; c < 3; c++) {
      const skip = (r === 0 && c === 0) || (r === 2 && c === 0) || (r === 2 && c === 2);
      if (skip) continue;
      const fill = (r === 1 && c === 1) ? P.navy : P.panel;
      rect(px(c), py(r), pw, ph, fill);
    }
  }

  // ── PHOTO PANELS ──────────────────────────────────────────────────────────

  // (0,0) Logo Cover — misty water, deep navy overlay
  drawPhotoPanel(imgs.logoCover, px(0), py(0), pw, ph, P.navy, 0.55);

  // (0,2) Bildwelt — forest/lake, lighter overlay to show nature
  drawPhotoPanel(imgs.bildwelt, px(0), py(2), pw, ph, P.navy, 0.38);

  // (2,2) Anwendung — aerial water, slate overlay
  drawPhotoPanel(imgs.anwendung, px(2), py(2), pw, ph, P.slate, 0.50);

  // ─────────────────────────────────────────────────────────────────────────
  // PANEL (0,0) — LOGO COVER (auf Foto)
  // ─────────────────────────────────────────────────────────────────────────
  {
    const x = px(0), y = py(0);

    // Logo mark — white on dark photo
    drawCubeMark(x + pw*0.12, y + ph*0.22, 30, P.white, P.moss, 2);

    ctx.save();
    ctx.font = '700 30px system-ui';
    ctx.fillStyle = P.white;
    ctx.letterSpacing = '-0.5px';
    ctx.fillText('UBA-Datacube', x + 22, y + ph * 0.68);
    ctx.restore();

    // Divider
    line(x + 22, y + ph*0.73, x + pw - 22, y + ph*0.73, P.white + '44', 0.5);

    ctx.save();
    ctx.font = '300 12px system-ui';
    ctx.fillStyle = P.fog;
    ctx.letterSpacing = '0.3px';
    ctx.fillText('Umweltdaten. Klar gemacht.', x + 22, y + ph * 0.83);
    ctx.restore();

    sectionTag('Logo', x + 22, y + ph - 18, P.mist);
  }

  // ─────────────────────────────────────────────────────────────────────────
  // PANEL (1,0) — LOGO KONSTRUKTION
  // ─────────────────────────────────────────────────────────────────────────
  {
    const x = px(1), y = py(0);
    for (let i = 1; i < 5; i++) {
      line(x+(pw/5)*i, y+10, x+(pw/5)*i, y+ph-10, P.panelAlt, 0.5);
      line(x+10, y+(ph/5)*i, x+pw-10, y+(ph/5)*i, P.panelAlt, 0.5);
    }
    const cx2 = x+pw*0.22, cy2 = y+ph*0.20;
    drawCubeMark(cx2, cy2, 22, P.slate, P.moss, 1.3);

    const ax = cx2 + 56;
    line(ax, cy2, ax+30, cy2-18, P.fog, 0.7);
    line(ax, cy2, ax, cy2+22, P.fog, 0.7);
    line(ax, cy2, ax-28, cy2+22, P.fog, 0.7);
    ctx.save(); ctx.font='400 7px system-ui'; ctx.fillStyle=P.mist;
    ctx.fillText('Breite', ax+4, cy2-22);
    ctx.fillText('Tiefe', ax+3, cy2+34);
    ctx.fillText('Höhe', ax-42, cy2+18);
    ctx.restore();

    ctx.save();
    ctx.beginPath(); ctx.arc(x+pw*0.74, y+ph*0.44, 24, 0, Math.PI*2);
    ctx.strokeStyle=P.fog; ctx.lineWidth=0.5; ctx.setLineDash([2,3]); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(x+pw*0.74, y+ph*0.44, 15, 0, Math.PI*2);
    ctx.strokeStyle=P.mist; ctx.lineWidth=1; ctx.stroke();
    ctx.restore();
    drawCubeMark(x+pw*0.67, y+ph*0.38, 9, P.slate, P.moss, 1);

    ctx.save(); ctx.font='600 10px system-ui'; ctx.fillStyle=P.navy;
    ctx.fillText('Konstruktion', x+18, y+ph*0.68); ctx.restore();
    ctx.save(); ctx.font='300 8.5px system-ui'; ctx.fillStyle=P.stone;
    ctx.fillText('Cube-Mark · Gridbasiert · Skalierbar', x+18, y+ph*0.78); ctx.restore();
    rect(x+18, y+ph*0.63, 32, 2, P.moss, 1);
    sectionTag('Konstruktion', x+18, y+ph-18);
  }

  // ─────────────────────────────────────────────────────────────────────────
  // PANEL (2,0) — DIGITALE ANWENDUNG
  // ─────────────────────────────────────────────────────────────────────────
  {
    const x = px(2), y = py(0);
    const bx = x+18, by = y+20, bw = pw-36, bh = 22;
    rect(bx, by, bw, bh, P.panelAlt, 4);
    ['#D06060','#C8A040',P.moss].forEach((c,i) => {
      ctx.beginPath(); ctx.arc(bx+12+i*14, by+bh/2, 4, 0, Math.PI*2);
      ctx.fillStyle=c; ctx.fill();
    });
    ctx.save(); ctx.font='400 7.5px system-ui'; ctx.fillStyle=P.mist;
    ctx.fillText('uba-datacube.de/klima/temperatur', bx+56, by+14); ctx.restore();
    rect(bx, by+bh, bw, 3, P.navy, 0);

    ctx.save(); ctx.font='700 9.5px system-ui'; ctx.fillStyle=P.navy;
    ctx.fillText('Jährl. Gebietsmittel der Lufttemperatur', bx, by+bh+20); ctx.restore();
    rect(bx, by+bh+27, bw*0.65, 1.5, P.fog, 0);
    rect(bx, by+bh+34, bw*0.45, 1.5, P.fog, 0);

    const chartY = by+bh+44, chartH = ph-(chartY-y)-28;
    const barData = [0.42,0.55,0.48,0.62,0.58,0.70,0.65,0.80,0.72,0.88,0.76,1.0];
    const barW = (bw/barData.length)-2;
    barData.forEach((v,i) => {
      const bH = v*chartH;
      const fill = i===11 ? P.moss : i>7 ? P.slate : P.mist+'99';
      rect(bx+i*(barW+2), chartY+chartH-bH, barW, bH, fill, 2);
    });
    line(bx, chartY+chartH, bx+bw, chartY+chartH, P.fog, 0.5);
    sectionTag('Webapp', x+18, y+ph-18);
  }

  // ─────────────────────────────────────────────────────────────────────────
  // PANEL (0,1) — BRAND CLAIM
  // ─────────────────────────────────────────────────────────────────────────
  {
    const x = px(0), y = py(1);
    rect(x+22, y+ph*0.22, 3, ph*0.38, P.moss, 1);
    ctx.save(); ctx.font='800 32px system-ui'; ctx.fillStyle=P.navy; ctx.letterSpacing='-0.8px';
    ctx.fillText('Umwelt-', x+34, y+ph*0.36);
    ctx.fillText('daten.', x+34, y+ph*0.51); ctx.restore();
    ctx.save(); ctx.font='300 32px system-ui'; ctx.fillStyle=P.slate; ctx.letterSpacing='-0.5px';
    ctx.fillText('Klar gemacht.', x+34, y+ph*0.66); ctx.restore();
    sectionTag('Claim', x+22, y+ph-18);
  }

  // ─────────────────────────────────────────────────────────────────────────
  // PANEL (1,1) — FARBSYSTEM (dark navy)
  // ─────────────────────────────────────────────────────────────────────────
  {
    const x = px(1), y = py(1);
    ctx.save(); ctx.font='600 7.5px system-ui'; ctx.fillStyle=P.mist; ctx.letterSpacing='1.5px';
    ctx.fillText('FARBSYSTEM', x+18, y+28); ctx.restore();

    const swatches = [
      { col:'#1B2B3A', name:'Nacht' }, { col:'#3D5A6E', name:'Fjord' },
      { col:'#7A9BAD', name:'Arktis' }, { col:'#4A6741', name:'Moos' },
      { col:'#A8B8C0', name:'Nebel' }, { col:'#F4F2EE', name:'Gletscher' },
    ];
    const sw = (pw-40)/3, sh = (ph*0.55)/2;
    swatches.forEach((s,i) => {
      const c=i%3, r=Math.floor(i/3);
      const sx=x+18+c*(sw+3), sy=y+ph*0.14+r*(sh+6);
      rect(sx, sy, sw-2, sh-2, s.col, 4);
      ctx.save(); ctx.font='600 8px system-ui'; ctx.fillStyle='#A8B8C0';
      ctx.fillText(s.name, sx, sy+sh+8); ctx.restore();
      ctx.save(); ctx.font='400 7px system-ui'; ctx.fillStyle='#5A7080';
      ctx.fillText(s.col, sx, sy+sh+18); ctx.restore();
    });
    sectionTag('Palette', x+18, y+ph-18, P.mist);
  }

  // ─────────────────────────────────────────────────────────────────────────
  // PANEL (2,1) — TYPOGRAFIE
  // ─────────────────────────────────────────────────────────────────────────
  {
    const x = px(2), y = py(1);
    ctx.save(); ctx.font='200 110px system-ui'; ctx.fillStyle=P.navy+'18';
    ctx.fillText('Aa', x+pw*0.05, y+ph*0.68); ctx.restore();
    ctx.save(); ctx.font='200 62px system-ui'; ctx.fillStyle=P.navy; ctx.letterSpacing='-2px';
    ctx.fillText('Aa', x+22, y+ph*0.48); ctx.restore();
    line(x+22, y+ph*0.55, x+pw-22, y+ph*0.55, P.fog, 0.5);
    ctx.save(); ctx.font='700 10px system-ui'; ctx.fillStyle=P.navy;
    ctx.fillText('Geist Variable', x+22, y+ph*0.63); ctx.restore();
    [['300','Light'],['400','Regular'],['600','SemiBold'],['700','Bold']].forEach(([w,l],i) => {
      ctx.save(); ctx.font=`${w} 8.5px system-ui`; ctx.fillStyle=P.stone;
      ctx.fillText(`${l} — Die Erde spricht in Daten.`, x+22, y+ph*0.70+i*14); ctx.restore();
    });
    sectionTag('Typografie', x+22, y+ph-18);
  }

  // ─────────────────────────────────────────────────────────────────────────
  // PANEL (0,2) — BILDWELT (Foto mit Overlay)
  // ─────────────────────────────────────────────────────────────────────────
  {
    const x = px(0), y = py(2);

    // Gradient overlay — dark at bottom for text legibility
    const grad = ctx.createLinearGradient(x, y, x, y+ph);
    grad.addColorStop(0, 'rgba(27,43,58,0.15)');
    grad.addColorStop(0.5, 'rgba(27,43,58,0.30)');
    grad.addColorStop(1, 'rgba(27,43,58,0.75)');
    ctx.save();
    ctx.beginPath(); ctx.roundRect(x, y, pw, ph, 6); ctx.clip();
    ctx.fillStyle = grad; ctx.fillRect(x, y, pw, ph);
    ctx.restore();

    // Moss accent bar top
    ctx.save(); ctx.beginPath(); ctx.roundRect(x, y, pw, ph, 6); ctx.clip();
    rect(x, y, pw, 3, P.moss, 0);
    ctx.restore();

    // Logo badge top-left
    ctx.save();
    ctx.beginPath(); ctx.roundRect(x+16, y+14, 36, 36, 4); ctx.clip();
    ctx.fillStyle = 'rgba(244,242,238,0.15)'; ctx.fillRect(x+16, y+14, 36, 36);
    ctx.restore();
    drawCubeMark(x+20, y+22, 7, P.white, P.moss, 1.2);

    // Text bottom
    ctx.save(); ctx.font='300 13px system-ui'; ctx.fillStyle='rgba(244,242,238,0.75)';
    ctx.fillText('Was die Erde zeigt —', x+20, y+ph*0.72); ctx.restore();
    ctx.save(); ctx.font='700 15px system-ui'; ctx.fillStyle=P.white;
    ctx.fillText('klar erzählt.', x+20, y+ph*0.84); ctx.restore();

    sectionTag('Bildwelt', x+20, y+ph-18, P.mist);
  }

  // ─────────────────────────────────────────────────────────────────────────
  // PANEL (1,2) — ICON SYSTEM
  // ─────────────────────────────────────────────────────────────────────────
  {
    const x = px(1), y = py(2);
    const icons = [
      {sym:'◎',name:'Datensatz'},{sym:'≋',name:'Methodik'},
      {sym:'↗',name:'Trend'},{sym:'⬡',name:'Kontext'},
      {sym:'∿',name:'Verlauf'},{sym:'△',name:'Klima'},
    ];
    const iw=(pw-40)/3, ih=(ph*0.72)/2;
    icons.forEach((ic,idx) => {
      const c=idx%3, r=Math.floor(idx/3);
      const ix=x+18+c*iw, iy=y+ph*0.10+r*ih;
      rect(ix, iy, iw-8, ih-8, P.panelAlt, 5);
      ctx.save(); ctx.font='200 22px system-ui'; ctx.fillStyle=P.slate;
      ctx.fillText(ic.sym, ix+10, iy+28); ctx.restore();
      ctx.save(); ctx.font='500 7px system-ui'; ctx.fillStyle=P.stone;
      ctx.fillText(ic.name, ix+10, iy+ih-18); ctx.restore();
    });
    sectionTag('Icons', x+18, y+ph-18);
  }

  // ─────────────────────────────────────────────────────────────────────────
  // PANEL (2,2) — ANWENDUNG (Foto mit Card + Badge overlay)
  // ─────────────────────────────────────────────────────────────────────────
  {
    const x = px(2), y = py(2);

    // Gradient for bottom text area
    const grad = ctx.createLinearGradient(x, y, x, y+ph);
    grad.addColorStop(0, 'rgba(61,90,110,0.10)');
    grad.addColorStop(1, 'rgba(27,43,58,0.65)');
    ctx.save(); ctx.beginPath(); ctx.roundRect(x, y, pw, ph, 6); ctx.clip();
    ctx.fillStyle=grad; ctx.fillRect(x, y, pw, ph);
    ctx.restore();

    // Business card floating on photo
    const cx = x+20, cy = y+24, cw = pw-40, ch = ph*0.50;
    // Card shadow
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.35)';
    ctx.shadowBlur = 18;
    ctx.shadowOffsetY = 6;
    rect(cx, cy, cw, ch, P.navy, 8);
    ctx.restore();

    // Moss top accent on card
    ctx.save(); ctx.beginPath(); ctx.roundRect(cx, cy, cw, ch, 8); ctx.clip();
    rect(cx, cy, cw, 3, P.moss, 0);
    ctx.restore();

    drawCubeMark(cx+16, cy+18, 10, P.white, P.moss, 1);

    ctx.save(); ctx.font='600 11px system-ui'; ctx.fillStyle=P.white;
    ctx.fillText('UBA-Datacube', cx+16, cy+ch*0.58); ctx.restore();
    ctx.save(); ctx.font='300 8px system-ui'; ctx.fillStyle=P.mist;
    ctx.fillText('Umweltdaten. Klar gemacht.', cx+16, cy+ch*0.73); ctx.restore();
    line(cx+16, cy+ch*0.80, cx+cw-16, cy+ch*0.80, P.slate, 0.4);
    ctx.save(); ctx.font='400 7px system-ui'; ctx.fillStyle=P.mist+'AA';
    ctx.fillText('uba-datacube.de', cx+16, cy+ch*0.90); ctx.restore();

    // Badge on photo (bottom right)
    const bx=x+pw*0.72, bby=y+ph*0.78;
    ctx.beginPath(); ctx.arc(bx, bby, 32, 0, Math.PI*2);
    ctx.strokeStyle=P.moss; ctx.lineWidth=1.5; ctx.setLineDash([3,4]); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(bx, bby, 24, 0, Math.PI*2);
    ctx.fillStyle=P.moss; ctx.fill();
    drawCubeMark(bx-12, bby-8, 8, P.white, P.cream, 1);
    ctx.save(); ctx.font='500 5.5px system-ui'; ctx.fillStyle=P.cream; ctx.textAlign='center';
    ctx.fillText('UBA-DC', bx, bby+16); ctx.restore();

    chip('Draft', x+18, y+ph-28, P.mist, P.white);
    chip('Reviewed', x+66, y+ph-28, P.moss, P.white);
    sectionTag('Anwendung', x+18, y+ph-18, P.fog);
  }

  // ── OUTER LABELS ──────────────────────────────────────────────────────────
  ctx.save();
  ctx.font='400 9px system-ui'; ctx.fillStyle=P.stone; ctx.letterSpacing='0.5px';
  ctx.fillText('UBA-Datacube — Brand Identity System 2026', G, H-4);
  ctx.textAlign='right';
  ctx.fillText('01 / 01', W-G, H-4);
  ctx.restore();

  document.getElementById('loading').textContent = '';
}

// ── LOAD IMAGES THEN DRAW ──────────────────────────────────────────────────
Promise.all([
  loadImage(IMGS.logoCover),
  loadImage(IMGS.bildwelt),
  loadImage(IMGS.anwendung),
]).then(([logoCover, bildwelt, anwendung]) => {
  draw({ logoCover, bildwelt, anwendung });
}).catch(err => {
  // Fallback: draw without photos
  console.warn('Bilder konnten nicht geladen werden, zeichne ohne Fotos.', err);
  draw({ logoCover: null, bildwelt: null, anwendung: null });
  document.getElementById('loading').textContent = 'Fotos nicht verfügbar (offline?) — ohne Bilder gerendert.';
});
</script>
</body>
</html>
