<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#13202c"/>
      <stop offset="55%" stop-color="#1B2B3A"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Left accent bar -->
  <rect x="80" y="150" width="4" height="300" rx="2" fill="#dc2626"/>

  <!-- Eyebrow -->
  <text x="110" y="168" font-family="system-ui, -apple-system, sans-serif"
    font-size="22" font-weight="700" fill="#fca5a5" letter-spacing="3">KLIMAWANDEL · INTERAKTIVE KARTE</text>

  <!-- Title -->
  <text x="108" y="262" font-family="system-ui, -apple-system, sans-serif"
    font-size="74" font-weight="800" fill="white" letter-spacing="-2">Hitze in Deutschland</text>
  <text x="108" y="344" font-family="system-ui, -apple-system, sans-serif"
    font-size="74" font-weight="800" fill="white" letter-spacing="-2">seit 1951</text>

  <!-- Subtitle -->
  <text x="110" y="408" font-family="system-ui, -apple-system, sans-serif"
    font-size="28" font-weight="400" fill="rgba(255,255,255,0.65)" letter-spacing="0.5">Heiße Tage &amp; Sommertage · Landkreis für Landkreis · 1-km-Raster des DWD</text>

  <!-- Sun + heat motif (right) -->
  <g transform="translate(980,255)">
    <circle cx="0" cy="0" r="50" fill="#f59e0b"/>
    <g stroke="#dc2626" stroke-width="13" stroke-linecap="round">
      <line x1="0" y1="-72" x2="0" y2="-98"/>
      <line x1="0" y1="72" x2="0" y2="98"/>
      <line x1="-72" y1="0" x2="-98" y2="0"/>
      <line x1="72" y1="0" x2="98" y2="0"/>
      <line x1="-51" y1="-51" x2="-69" y2="-69"/>
      <line x1="51" y1="-51" x2="69" y2="-69"/>
      <line x1="-51" y1="51" x2="-69" y2="69"/>
      <line x1="51" y1="51" x2="69" y2="69"/>
    </g>
  </g>

  <!-- Wordmark + domain -->
  <text x="110" y="560" font-family="system-ui, -apple-system, sans-serif"
    font-size="30" font-weight="800" fill="white" letter-spacing="-1">Umwelt<tspan fill="#6B9A5E">puls</tspan><tspan font-weight="600" fill="rgba(255,255,255,0.4)" letter-spacing="1.5">   ·   WWW.UMWELTPULS.DE</tspan></text>
</svg>
