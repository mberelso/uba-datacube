<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1B2B3A"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Left accent bar -->
  <rect x="80" y="140" width="4" height="320" rx="2" fill="#38bdf8"/>

  <!-- Eyebrow -->
  <text x="110" y="162" font-family="system-ui, -apple-system, sans-serif"
    font-size="22" font-weight="700" fill="#c4b5fd" letter-spacing="3">MULTIVARIATE ZEITREIHEN-ANALYSE</text>

  <!-- Title -->
  <text x="108" y="254" font-family="system-ui, -apple-system, sans-serif"
    font-size="70" font-weight="800" fill="white" letter-spacing="-2">Datenvergleich &amp;</text>
  <text x="108" y="336" font-family="system-ui, -apple-system, sans-serif"
    font-size="70" font-weight="800" fill="white" letter-spacing="-2">Indikatoren-Baukasten</text>

  <!-- Subtitle -->
  <text x="110" y="404" font-family="system-ui, -apple-system, sans-serif"
    font-size="27" font-weight="400" fill="rgba(255,255,255,0.7)" letter-spacing="0.5">Dual-Y-Achse · Relativer Index-Trend · Pearson-Korrelation r</text>

  <!-- Dual trend lines motif (right) -->
  <g transform="translate(880,190)">
    <polyline points="0,120 45,95 95,105 145,55 200,20" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="0,30 45,55 95,45 145,85 200,115" fill="none" stroke="#f87171" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark + domain -->
  <text x="110" y="560" font-family="system-ui, -apple-system, sans-serif"
    font-size="30" font-weight="800" fill="white" letter-spacing="-1">Umwelt<tspan fill="#6B9A5E">puls</tspan><tspan font-weight="600" fill="rgba(255,255,255,0.4)" letter-spacing="1.5">   ·   WWW.UMWELTPULS.DE/VERGLEICH</tspan></text>
</svg>
