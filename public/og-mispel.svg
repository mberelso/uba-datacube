<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1B2B3A"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Left accent bar -->
  <rect x="80" y="140" width="4" height="320" rx="2" fill="#f59e0b"/>

  <!-- Eyebrow -->
  <text x="110" y="162" font-family="system-ui, -apple-system, sans-serif"
    font-size="22" font-weight="700" fill="#fcd34d" letter-spacing="3">BNETZA AZ. 618-25-02 · AB 01.10.2026</text>

  <!-- Title -->
  <text x="108" y="254" font-family="system-ui, -apple-system, sans-serif"
    font-size="70" font-weight="800" fill="white" letter-spacing="-2">MiSpeL-Simulator</text>
  <text x="108" y="336" font-family="system-ui, -apple-system, sans-serif"
    font-size="70" font-weight="800" fill="white" letter-spacing="-2">für Heimspeicher</text>

  <!-- Subtitle -->
  <text x="110" y="404" font-family="system-ui, -apple-system, sans-serif"
    font-size="27" font-weight="400" fill="rgba(255,255,255,0.7)" letter-spacing="0.5">Pauschaloption (500 kWh/kWp) · Indifferenzpuffer · Netzentgelt-Saldierung</text>

  <!-- Battery + Sun motif (right) -->
  <g transform="translate(970,255)">
    <rect x="-52" y="-76" width="104" height="156" rx="16" stroke="#fbbf24" stroke-width="10" fill="rgba(245,158,11,0.12)"/>
    <rect x="-24" y="-96" width="48" height="16" rx="5" fill="#fbbf24"/>
    <rect x="-34" y="24" width="68" height="36" rx="6" fill="#16a34a"/>
    <rect x="-34" y="-18" width="68" height="34" rx="6" fill="#22c55e"/>
    <rect x="-34" y="-56" width="68" height="30" rx="6" fill="#fbbf24"/>
  </g>

  <!-- Wordmark + domain -->
  <text x="110" y="560" font-family="system-ui, -apple-system, sans-serif"
    font-size="30" font-weight="800" fill="white" letter-spacing="-1">Umwelt<tspan fill="#6B9A5E">puls</tspan><tspan font-weight="600" fill="rgba(255,255,255,0.4)" letter-spacing="1.5">   ·   WWW.UMWELTPULS.DE/MISPEL</tspan></text>
</svg>

